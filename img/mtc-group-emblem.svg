<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512" role="img" aria-label="MTC-Group">
<title>MTC-Group — مجموعة شركات مركز تكنولوجيا الشرق الأوسط · Middle East Technology Center Group</title>
<defs>
  <!-- معدن فاخر: شمبانيا → برتقالي → وردي، يدور ببطء ليعطي لمعانًا حيًّا -->
  <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="30" y1="30" x2="170" y2="170"><stop offset="0" stop-color="#fff3dc"/><stop offset=".3" stop-color="#ffc37a"/><stop offset=".6" stop-color="#ff7a1a"/><stop offset=".85" stop-color="#ff2d55"/><stop offset="1" stop-color="#ffd9a8"/>
    <animateTransform attributeName="gradientTransform" type="rotate" values="0 100 100;360 100 100" dur="8s" repeatCount="indefinite"/></linearGradient>
  <linearGradient id="mono" gradientUnits="userSpaceOnUse" x1="76" y1="74" x2="124" y2="126"><stop offset="0" stop-color="#fffaf0"/><stop offset=".5" stop-color="#ffd59e"/><stop offset="1" stop-color="#ff8a3a"/></linearGradient>
  <radialGradient id="core" cx=".5" cy=".42" r=".62"><stop offset="0" stop-color="#3a1124"/><stop offset=".65" stop-color="#1a0812"/><stop offset="1" stop-color="#0b0509"/></radialGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#ff4b3a" stop-opacity=".55"/><stop offset=".6" stop-color="#ff2d55" stop-opacity=".12"/><stop offset="1" stop-color="#ff2d55" stop-opacity="0"/></radialGradient>
  <linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="hexc"><path d="M100 26L164.09 63V137L100 174L35.91 137V63Z"/></clipPath>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<style>
/* دخول (≈2.2ث) */
.hud{transform-origin:100px 100px;opacity:0;animation:hudIn 1.2s cubic-bezier(.2,.8,.2,1) .1s forwards}
.edge{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1.1s cubic-bezier(.65,0,.35,1) .25s forwards}
.fillin{opacity:0;animation:fade .8s ease .7s forwards}
.m{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1s cubic-bezier(.65,0,.35,1) .9s forwards}
.tr{stroke-dasharray:100;stroke-dashoffset:100;animation:draw .6s cubic-bezier(.65,0,.35,1) 1.5s forwards}
.nd{transform-box:fill-box;transform-origin:center;opacity:0;animation:pop .5s cubic-bezier(.34,1.56,.64,1) 1.9s forwards}
/* حركة دائمة */
.r1{transform-origin:100px 100px;animation:spin 40s linear infinite}
.r2{transform-origin:100px 100px;animation:spin 26s linear infinite reverse}
.sat{transform-origin:100px 100px;animation:spin 7s linear infinite}
.pl{stroke-dasharray:14 120;stroke-dashoffset:14;opacity:0;animation:flow 2.6s cubic-bezier(.5,0,.5,1) infinite}
.mglow{opacity:0;animation:breathe 3.2s ease-in-out 2s infinite}
.vx{animation:twinkle 3s ease-in-out infinite}
.sh{animation:sweep 5.5s cubic-bezier(.4,0,.2,1) 2.4s infinite}
.halo{transform-origin:100px 100px;animation:halo 4s ease-in-out infinite}
@keyframes hudIn{from{opacity:0;transform:scale(.7) rotate(-40deg)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{0%{stroke-dashoffset:14;opacity:0}10%{opacity:1}70%{opacity:1}100%{stroke-dashoffset:-104;opacity:0}}
@keyframes breathe{0%,100%{opacity:.25}50%{opacity:.85}}
@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes sweep{0%{transform:translateX(-150px) skewX(-20deg)}40%,100%{transform:translateX(170px) skewX(-20deg)}}
@keyframes halo{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.08);opacity:1}}
</style>

<circle class="halo" cx="100" cy="100" r="96" fill="url(#halo)"/>

<!-- حلقات HUD تقنية تدور باتجاهين متعاكسين + قمر بيانات -->
<g class="hud">
  <g class="r1"><circle cx="100" cy="100" r="92" fill="none" stroke="url(#gold)" stroke-width="1.6" stroke-dasharray="46 10 6 10 2 10" stroke-linecap="round" opacity=".75"/></g>
  <g class="r2"><circle cx="100" cy="100" r="85" fill="none" stroke="#ffc37a" stroke-width="2.4" stroke-dasharray=".8 4.2" opacity=".35"/></g>
  <g class="sat"><circle cx="100" cy="8" r="3" fill="#fff" filter="url(#glow)"/></g>
</g>

<!-- الرقاقة السداسية -->
<g class="fillin">
  <path d="M100 26L164.09 63V137L100 174L35.91 137V63Z" fill="url(#core)"/>
  <path d="M100 38L153.69 69V131L100 162L46.31 131V69Z" fill="none" stroke="#ffc37a" stroke-opacity=".22" stroke-width="1"/>
  <g clip-path="url(#hexc)"><rect class="sh" x="40" y="10" width="34" height="180" fill="url(#sheen)"/></g>
</g>
<path class="edge" pathLength="100" d="M100 26L164.09 63V137L100 174L35.91 137V63Z" fill="none" stroke="url(#gold)" stroke-width="3.6" stroke-linejoin="round"/>
<g fill="#fff3dc" filter="url(#glow)">
  <circle class="vx" cx="100" cy="26" r="2.2"/><circle class="vx" style="animation-delay:.5s" cx="164.09" cy="63" r="2.2"/><circle class="vx" style="animation-delay:1s" cx="164.09" cy="137" r="2.2"/>
  <circle class="vx" style="animation-delay:1.5s" cx="100" cy="174" r="2.2"/><circle class="vx" style="animation-delay:2s" cx="35.91" cy="137" r="2.2"/><circle class="vx" style="animation-delay:2.5s" cx="35.91" cy="63" r="2.2"/>
</g>

<!-- مسارات الدارة الإلكترونية -->
<g fill="none" stroke="#ffb46a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".7">
  <path class="tr" pathLength="100" d="M76 124V132L68 140"/><path class="tr" pathLength="100" d="M124 124V132L132 140"/>
  <path class="tr" pathLength="100" d="M100 110V148"/><path class="tr" pathLength="100" d="M100 90V52"/>
  <path class="tr" pathLength="100" d="M76 76V66L84 58"/><path class="tr" pathLength="100" d="M124 76V66L116 58"/>
  <path class="tr" pathLength="100" d="M71 100H56"/><path class="tr" pathLength="100" d="M129 100H144"/>
</g>
<!-- نبضات بيانات تنطلق من الحرف إلى أطراف الرقاقة -->
<g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
  <path class="pl" pathLength="100" style="animation-delay:2.2s" d="M100 90V52"/>
  <path class="pl" pathLength="100" style="animation-delay:2.5s" d="M124 76V66L116 58"/>
  <path class="pl" pathLength="100" style="animation-delay:2.8s" d="M129 100H144"/>
  <path class="pl" pathLength="100" style="animation-delay:3.1s" d="M124 124V132L132 140"/>
  <path class="pl" pathLength="100" style="animation-delay:3.4s" d="M100 110V148"/>
  <path class="pl" pathLength="100" style="animation-delay:3.7s" d="M76 124V132L68 140"/>
  <path class="pl" pathLength="100" style="animation-delay:4s" d="M71 100H56"/>
  <path class="pl" pathLength="100" style="animation-delay:4.3s" d="M76 76V66L84 58"/>
</g>
<g fill="#160a10" stroke="url(#gold)" stroke-width="1.8">
  <circle class="nd" cx="68" cy="140" r="3.4"/><circle class="nd" cx="132" cy="140" r="3.4"/><circle class="nd" cx="100" cy="150" r="3.4"/><circle class="nd" cx="100" cy="50" r="3.4"/>
  <circle class="nd" cx="84" cy="58" r="3.4"/><circle class="nd" cx="116" cy="58" r="3.4"/><circle class="nd" cx="54" cy="100" r="3.4"/><circle class="nd" cx="146" cy="100" r="3.4"/>
</g>

<!-- الحرف M — قلب الشعار -->
<path class="mglow" d="M76 122V78L100 102L124 78V122" fill="none" stroke="#ff8a3a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>
<path class="m" pathLength="100" d="M76 122V78L100 102L124 78V122" fill="none" stroke="url(#mono)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
