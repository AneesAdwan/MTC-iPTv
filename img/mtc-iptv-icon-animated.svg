<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" role="img" aria-label="MTC-iPTv">
<title>MTC-iPTv — بث مباشر</title>
<defs>
<linearGradient id="g" gradientUnits="userSpaceOnUse" x1="8" y1="8" x2="56" y2="56"><stop offset="0" stop-color="#ff2d55"/><stop offset=".5" stop-color="#ff5a36"/><stop offset="1" stop-color="#ffb02e"/>
<animateTransform attributeName="gradientTransform" type="rotate" values="0 32 32;360 32 32" dur="6s" repeatCount="indefinite"/></linearGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<path id="orbit" d="M32 4.5a27.5 27.5 0 1 1 0 55a27.5 27.5 0 1 1 0-55"/>
</defs>
<style>
.in{transform-origin:32px 32px;animation:pop 1s cubic-bezier(.34,1.56,.64,1) both}
.p{transform-box:fill-box;transform-origin:center;animation:beat 2.4s ease-in-out 1.2s infinite}
.a{stroke-dasharray:100;stroke-dashoffset:100;animation:draw .55s cubic-bezier(.65,0,.35,1) forwards,sig 2.4s ease-in-out infinite}
.a1{animation-delay:.7s,1.2s}.a2{animation-delay:.85s,1.45s}
.rip{transform-origin:32px 32px;opacity:0;animation:rip 2.4s cubic-bezier(.2,.6,.3,1) 1.2s infinite}
.orb{opacity:0;animation:fade .6s 1.1s forwards}
@keyframes pop{0%{opacity:0;transform:scale(.2) rotate(-90deg)}100%{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes beat{0%,100%{transform:scale(1)}10%{transform:scale(.86)}22%{transform:scale(1.08)}34%{transform:scale(1)}}
@keyframes sig{0%,100%{opacity:.5}20%,35%{opacity:1}65%{opacity:.5}}
@keyframes rip{0%{opacity:.9;transform:scale(.7)}100%{opacity:0;transform:scale(2.3)}}
@keyframes fade{to{opacity:1}}
</style>
<circle class="rip" cx="32" cy="32" r="11" fill="none" stroke="url(#g)" stroke-width="1.6"/>
<g class="in">
<circle cx="32" cy="32" r="12.5" fill="url(#g)" filter="url(#glow)"/>
<path class="p" d="M28.5 25.5L38.5 32 28.5 38.5Z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
<g fill="none" stroke="url(#g)" stroke-width="3.6" stroke-linecap="round" filter="url(#glow)">
<path class="a a1" pathLength="100" d="M44.26 21.72A16 16 0 0 1 44.26 42.28M19.74 42.28A16 16 0 0 1 19.74 21.72"/>
<path class="a a2" pathLength="100" d="M51.15 15.93A25 25 0 0 1 51.15 48.07M12.85 48.07A25 25 0 0 1 12.85 15.93"/>
</g>
<g class="orb"><circle cx="32" cy="32" r="27.5" fill="none" stroke="#ff7a1a" stroke-opacity=".2" stroke-width=".8" stroke-dasharray="1.5 3"/>
<circle r="2.2" fill="#fff" filter="url(#glow)"><animateMotion dur="4s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion></circle></g>
</g>
</svg>
