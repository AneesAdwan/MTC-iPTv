# The website (https://aneesadwan.github.io/MTC-iPTv/)
# Publish MTC-iPTv 2.7.2 with the final VOD category fix. The Windows update feed (updates/) is published from the
# private code (AneesAdwan/MTC-iPTv-src) — this repo only keeps the README and the releases.
# Started by the release script and after site changes; also every 6 hours as a safety net.
name: Website

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/website.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: AneesAdwan/MTC-iPTv-src
          ssh-key: ${{ secrets.SRC_DEPLOY_KEY }}
      - name: Validate VOD module syntax
        run: node --input-type=module --check < src/movies.js
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: false
      - name: Build Flutter Web viewer
        working-directory: mtc_iptv/web_portal
        env:
          MTC_GATEWAY_URL: ${{ vars.MTC_GATEWAY_URL }}
        run: |
          flutter pub get
          flutter analyze
          flutter test --platform chrome
          flutter build web --release --base-href /MTC-iPTv/ --dart-define=MTC_GATEWAY_URL="$MTC_GATEWAY_URL"
      - name: Assemble Pages artifact
        run: |
          mkdir _site
          cp index.html _site/legacy.html
          for p in config.js sw.js manifest.webmanifest .nojekyll src img download beta updates data; do
            if [ -e "$p" ]; then cp -R "$p" _site/; fi
          done
          cp -R mtc_iptv/web_portal/build/web/. _site/
      # The published catalog as one file (MTC-Panel plan §8.4): a fresh app install reads it from here instead of
      # thousands of rows from the database, then asks the database only for what changed after its rev.
      # Same rows as catalog_changes (the public function the apps use); a failure only skips the file.
      - name: Catalog snapshot
        continue-on-error: true
        run: |
          URL=$(jq -r .url data/backend.json); KEY=$(jq -r .anon_key data/backend.json)
          since=0; echo '[]' > ch.json; echo '[]' > st.json
          for i in $(seq 1 60); do
            curl -sf --retry 3 "$URL/rest/v1/rpc/catalog_changes" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
              -H 'Content-Type: application/json' -d "{\"since\":$since,\"max_rows\":2000}" > page.json
            jq -s '.[0] + .[1].channels' ch.json page.json > t.json && mv t.json ch.json
            jq -s '.[0] + .[1].streams' st.json page.json > t.json && mv t.json st.json
            next=$(jq .rev page.json); more=$(jq .more page.json)
            if [ "$more" != true ] || [ "$next" = "$since" ]; then since=$next; break; fi
            since=$next
          done
          mkdir -p _site/data
          jq -n --arg b "$URL" --argjson rev "$since" --slurpfile c ch.json --slurpfile s st.json \
            '{v: 1, backend: $b, rev: $rev, at: (now | todate), channels: $c[0], streams: $s[0]}' | gzip -9 > _site/data/catalog.json.gz
          echo "snapshot rev $since: $(jq length ch.json) channels, $(jq length st.json) links, $(stat -c %s _site/data/catalog.json.gz) bytes"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
