name: mtc_update
description: >-
  Secure self-update for MTC-iPTv SuperAdmin (Windows) in pure Dart -
  Ed25519-signed release manifests, anti-rollback, side-by-side install with
  automatic restore, and the release signing / key generation CLIs.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  archive: ^4.0.0
  args: ^2.5.0
  crypto: ^3.0.7
  cryptography: ^2.9.0
  path: ^1.9.0
  pub_semver: ^2.1.4

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

executables:
  sign_release:
  keygen:
